# ==========================================
# 1. ESPACIO DE TRABAJO Y CONFIGURACIÓN ISTIO
# ==========================================
apiVersion: v1
kind: Namespace
metadata:
  name: microservices-demo
  labels:
    istio-injection: enabled
---
# ==========================================
# 2. BASE DE DATOS MYSQL
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: microservices-demo
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword"
        - name: MYSQL_DATABASE
          value: "ecommerce_db"
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: db  # Este nombre es vital porque tus backends lo buscan como "db:3306"
  namespace: microservices-demo
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
# ==========================================
# 3. MICROSERVICIO: BACK DESPACHOS
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-despachos-deployment
  namespace: microservices-demo
  labels:
    app: back-despachos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back-despachos
  template:
    metadata:
      labels:
        app: back-despachos
        version: v1
    spec:
      containers:
      - name: api-despachos
        image: uboasktt/api-despachos:latest
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://db:3306/ecommerce_db?useSSL=false&serverTimezone=UTC"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "rootpassword"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: back-despachos-service
  namespace: microservices-demo
spec:
  selector:
    app: back-despachos
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8080
---
# ==========================================
# 4. MICROSERVICIO: BACK VENTAS
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-ventas-deployment
  namespace: microservices-demo
  labels:
    app: back-ventas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back-ventas
  template:
    metadata:
      labels:
        app: back-ventas
        version: v1
    spec:
      containers:
      - name: api-ventas
        image: uboasktt/api-ventas:latest
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://db:3306/ecommerce_db?useSSL=false&serverTimezone=UTC"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "rootpassword"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: back-ventas-service
  namespace: microservices-demo
spec:
  selector:
    app: back-ventas
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8080
---
# ==========================================
# 5. FRONTEND: DESPACHO
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: microservices-demo
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      containers:
      - name: ui-frontend
        image: uboasktt/front-despacho:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: microservices-demo
spec:
  type: LoadBalancer # Esto nos dará la IP pública de AWS para entrar al navegador
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
